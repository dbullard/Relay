name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build
        run: |
          xcodebuild build -project Relay.xcodeproj -scheme Relay \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build Relay Mobile (iOS Simulator)
        run: |
          xcodebuild build -project Relay.xcodeproj -scheme "Relay Mobile" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test -project Relay.xcodeproj -scheme Relay \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO
